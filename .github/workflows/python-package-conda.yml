name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt
    # conda env update --file environment.yml --name base --no-plugins
    - name: Lint with flake8
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Download data
      run: |
        wget -O babel_mv_0.1.pkl https://www.dropbox.com/scl/fi/wkhr2iap7kpa39qvwek31/babel_mv_0.1_30p_train_100p_val.pkl?rlkey=bp3ek9zteas8lyus61uu71uvc&dl=0
        wget https://babel.is.tue.mpg.de/media/upload/data/babel_v1-0_release.zip
        unzip babel_v1-0_release.zip
    - name: Stats
      run:
        python tools/data_stats.py babel_mv_0.1.pkl --babel_path babel_v1.0_release > coverage.txt
    - name: Archivage coverage
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coverage.txt
    - name:
      uses: actions/download-artifact@v4
      with:
        name: code-coverage-report
    - name: Display structure of downloaded files
      run: ls -R
    # - name: Test with pytest
      # run: |
      #   conda install pytest
      #   pytest
